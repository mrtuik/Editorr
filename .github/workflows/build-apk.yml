name: Build Editorrr v16 APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 16.14.0
      # YouTube music module: ALWAYS ON. Nothing to tick, no variable to set.
      EDITORR_YOUTUBE: '1'
      # Built-in Antigravity. Where the Linux base bundle is downloaded from on the phone (set your own release URL if you host a copy).
      EDITORR_RUNTIME_BASE_URL: https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4
      # PRoot can only run its Linux programs when targetSdk is 28 (same as Rlaude Harness). Raise it only if you test that it still works.
      EDITORR_TARGET_SDK: '28'
      VITE_YOUTUBE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---- Signing key: the SAME key every build, so Android installs the new APK as an update ----
      - name: Use keystore from secrets
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KS_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Restore saved keystore (no secrets set)
        if: env.HAS_KEYSTORE != 'true'
        id: ks_cache
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: editorr-keystore-v1

      - name: Create keystore once (no secrets set)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p .ci-keystore
          if [ ! -f .ci-keystore/release.jks ]; then
            echo "No saved keystore found. Creating a new one."
            keytool -genkeypair -v -keystore .ci-keystore/release.jks -storetype PKCS12 \
              -alias editorr -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass editorr-ci-pass -keypass editorr-ci-pass \
              -dname "CN=Editorr, OU=Tuik, O=Tuik, C=BD"
            echo "NEW_KEYSTORE=true" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$GITHUB_WORKSPACE/.ci-keystore/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=editorr-ci-pass" >> "$GITHUB_ENV"
          echo "KS_ALIAS=editorr" >> "$GITHUB_ENV"
          echo "KEY_PASS=editorr-ci-pass" >> "$GITHUB_ENV"

      # Backup copy of an auto-created key. Download it and save it as the KEYSTORE_BASE64 secret (see README).
      - name: Upload keystore backup (only when newly created)
        if: env.NEW_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Editorr-keystore-BACKUP
          path: .ci-keystore/release.jks
          retention-days: 90

      # Antigravity is built into Editorr: PRoot is compiled from source with the NDK (arm64 only).
      - name: Install NDK + CMake (for the built-in Antigravity runtime)
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Fetch native sources (PRoot, libandroid-shmem)
        run: |
          mkdir -p native/android/third_party
          if [ ! -f native/android/third_party/proot/src/cli/proot.c ]; then
            rm -rf native/android/third_party/proot
            git clone --depth 1 https://github.com/termux/proot.git native/android/third_party/proot
          fi
          if [ ! -f native/android/third_party/libandroid-shmem/shmem.c ]; then
            rm -rf native/android/third_party/libandroid-shmem
            git clone --depth 1 https://github.com/termux/libandroid-shmem.git native/android/third_party/libandroid-shmem
          fi

      - name: Fetch whisper.cpp (native Whisper for captions)
        run: |
          if [ ! -f native/android/third_party/whisper.cpp/CMakeLists.txt ]; then
            rm -rf native/android/third_party/whisper.cpp
            git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp.git native/android/third_party/whisper.cpp
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Get face model and MediaPipe files (offline Autoframe)
        run: npm run face-assets

      - name: Remove stale v8 screens
        run: rm -f src/screens/sync.ts src/screens/analyze.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Build web app
        run: npx vite build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Patch Android project (native plugin, Media3, permissions, signing, version)
        run: python3 scripts/patch-android.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check signature and version
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | head -5
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -1
          cp "$APK" "Editorrr-v${VERSION_NAME}.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Editorrr-apk
          path: Editorrr-v*.apk
