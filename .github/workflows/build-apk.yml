name: Build Editorr APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Build web app
        run: npx vite build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Patch Android project (native plugin, Media3, permissions)
        run: python3 scripts/patch-android.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/Editorr-release-signed.apk \
            "$ALIGNED"

      - name: Upload debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: Editorr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Editorr-release-apk
          path: android/app/build/outputs/apk/release/Editorr-release-signed.apk
          if-no-files-found: ignore
